[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-patient-qgnn"
version = "0.1.0"
description = "Drug-Patient Interaction Pipeline with Quantum Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Drug-Patient QGNN Team"}
]
keywords = ["quantum", "machine-learning", "drug-discovery", "gnn", "quantum-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "pennylane>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
molecular = [
    "rdkit>=2022.03.1",
    "biopython>=1.79",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
gpu = [
    "pennylane-lightning-gpu>=0.32.0",
]
all = [
    "drug-patient-qgnn[dev,molecular,viz,gpu]",
]

[project.urls]
Homepage = "https://github.com/your-repo/drug-patient-qgnn"
Documentation = "https://github.com/your-repo/drug-patient-qgnn"
Repository = "https://github.com/your-repo/drug-patient-qgnn"
Issues = "https://github.com/your-repo/drug-patient-qgnn/issues"

[tool.setuptools]
packages = ["drug_patient_qgnn"]

[tool.setuptools.package-data]
drug_patient_qgnn = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
