# Configurations used in `main.ipynb` (or `main.py`)

Settings:
  mode: '111'         # Stands for ('train', 'valid', 'test').
  use_wandb: false     # Whether using wandb to monitor training procedure.
  print_log: false    # Whether print logs during training.
  suffix: ''          # Suffix description of this training.

Train:
  max_epochs: 30            # Maximum number of epochs.
  log_every_n_steps: 50     # Log every n steps.
  num_sanity_val_steps: 0   # To avoid calculating AUC for single class.
  ckpt_monitor: 'valid_auc' # Monitor AUC of validation data.
  ckpt_mode: 'max'          # Save the model with the maximum AUC.
  ckpt_top_k: 5             # Save top k models with highest AUC.

Performance:
  num_workers: 8            # Number of data loader workers (0 = main process only).
  use_mixed_precision: true # Use mixed precision (16-bit) training on GPU for speed.
  benchmark_mode: true      # Enable cudnn.benchmark for faster training.
  pin_memory: true          # Pin memory for faster GPU data transfer.
  gpu_memory_fraction: 0.8  # Use 80% of GPU memory (0.0-1.0).
  cpu_worker_fraction: 0.8  # Use 80% of CPU cores for data loading (0.0-1.0).

Data:
  num_train: 2500      # Number of training data per channel.
  num_valid: 500       # Number of validation data per channel.
  num_test: 500        # Number of testing data per channel.
  batch_size: 64       # Batch size.
  pt_threshold: 0.025  # Percentage of daughter pt to jet pt threshold.
  min_num_ptcs: 4      # Minimum number of particles per jet.
  max_num_ptcs: 16     # Maximum number of particles per jet.
  
TopQCD:
  dataset: 'TopQCD'    # Dataset name.
  num_classes: 2       # Number of classes.
  pt_min: 550          # Minimum of jet pt.
  pt_max: 650          # Maximum of jet pt.

JetNet:
  dataset: 'JetNet'    # Dataset name.
  num_classes: 5       # Number of classes.
  pt_min: 800          # Minimum of jet pt.
  pt_max: 1200         # Maximum of jet pt.